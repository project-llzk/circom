name: Update llzk-rs

on:
  schedule:
    - cron: '17 05 * * *' # Daily at 05:17 UTC.
  workflow_dispatch:

concurrency:
  group: update-llzk-rs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'
      - name: Run dependency update script
        run: ./scripts/update_llzk_lib.sh
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CIRCOM_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIRCOM_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: automation/update-llzk-rs
          delete-branch: true
          add-paths: |
            flake.lock
            Cargo.lock
          commit-message: 'chore: update llzk-rs'
          title: 'chore: update llzk-rs'
          body: |
            Updated llzk-rs nix and cargo dependencies using `scripts/update_llzk_lib.sh`.
      - name: Enable squash auto-merge
        if: steps.create_pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --auto --squash
